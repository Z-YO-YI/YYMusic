import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.artifacts.result.ResolvedArtifactResult
import org.gradle.maven.MavenModule
import org.gradle.maven.MavenPomArtifact
import java.security.MessageDigest

// Developer/CI inventory only. Does not change dependencies or application tasks.
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return // Flutter's included Gradle build has no :app.
    app.tasks.register('yyAudioDependencyReport') {
        doLast {
            def variant = app.providers.gradleProperty('yyAudioVariant').getOrElse('debug')
            if (!(variant in ['debug', 'profile', 'release'])) {
                throw new GradleException('Unsupported audio inventory variant')
            }
            def config = app.configurations.getByName(variant + 'RuntimeClasspath')
            def roots = config.incoming.resolutionResult.allComponents.findAll {
                it.id instanceof ModuleComponentIdentifier && it.id.group == 'androidx.media3'
            }
            def seen = new TreeSet<String>()
            def visit
            visit = { component ->
                def id = component.id
                if (!(id instanceof ModuleComponentIdentifier)) return
                def coordinate = "${id.group}:${id.module}:${id.version}".toString()
                if (!seen.add(coordinate)) return
                component.dependencies.each { dependency ->
                    if (!(dependency instanceof ResolvedDependencyResult)) {
                        throw new GradleException('Unresolved audio dependency')
                    }
                    visit(dependency.selected)
                }
            }
            if (roots.isEmpty()) throw new GradleException('No Media3 audio roots')
            roots.each { visit(it) }
            // Gradle module metadata can otherwise leave POM files uncached on CI.
            def ids = config.incoming.resolutionResult.allComponents.collect { it.id }.findAll {
                it instanceof ModuleComponentIdentifier && seen.contains(it.displayName)
            }.unique()
            def poms = app.dependencies.createArtifactResolutionQuery().forComponents(ids)
                .withArtifacts(MavenModule, MavenPomArtifact).execute()
            if (poms.resolvedComponents.size() != ids.size()) throw new GradleException('Unresolved audio POM component')
            poms.resolvedComponents.each { component ->
                def files = component.getArtifacts(MavenPomArtifact)
                if (files.size() != 1 || !(files.first() instanceof ResolvedArtifactResult)) {
                    throw new GradleException('Missing precise audio POM: ' + component.id.displayName)
                }
            }
            def artifacts = config.incoming.artifactView {
                componentFilter { id ->
                    id instanceof ModuleComponentIdentifier && seen.contains(id.displayName)
                }
            }.artifacts.artifacts
            def components = seen.collect { coordinate ->
                def files = artifacts.findAll { it.id.componentIdentifier.displayName == coordinate }.collect { artifact ->
                    [name: artifact.file.name, path: artifact.file.absolutePath,
                     bytes: artifact.file.length(), sha256: MessageDigest.getInstance('SHA-256')
                         .digest(artifact.file.bytes).encodeHex().toString()]
                }.unique { it.name + ':' + it.sha256 }.sort { it.name }
                [coordinate: coordinate, artifacts: files]
            }
            def output = new File(app.rootProject.projectDir, '../build/audio-dependencies-' + variant + '.json')
            output.parentFile.mkdirs()
            output.setText(JsonOutput.prettyPrint(JsonOutput.toJson(
                [schemaVersion: 1, variant: variant, components: components])) + '\n', 'UTF-8')
            println('PASS: inventoried ' + components.size() + ' resolved audio coordinates (' + variant + ').')
        }
    }
}
