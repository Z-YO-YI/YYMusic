name: Native foundation

on:
  push:
    branches: ['codex/**', 'feat/**', 'fix/**', 'refactor/**', 'docs/**', 'main', 'master']
  pull_request:
  workflow_dispatch:
    inputs:
      run_just_audio_poc:
        description: Run the read-only just_audio native local WAV POC
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  checks:
    name: Source integrity, analyze and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Preserve reference and legacy fingerprints
        run: node --test tools/*.test.mjs
      - name: Verify all ZIP entries
        shell: pwsh
        run: ./tools/verify_reference_archive.ps1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - run: dart run drift_dev make-migrations
      - run: git diff --exit-code -- lib/data/database/app_database.g.dart drift_schemas/
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub --fatal-infos
      - run: flutter test --no-pub --reporter expanded

  windows-debug:
    name: Windows Debug build
    needs: checks
    if: github.event_name != 'workflow_dispatch' || !inputs.run_just_audio_poc
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Native widget goldens on their pinned host
        run: flutter test --no-pub --tags windows-golden --reporter expanded
      - run: flutter build windows --debug --no-pub
      - name: Verify portable Windows Debug bundle
        shell: pwsh
        run: ./tools/verify_windows_bundle.ps1
      - name: Upload portable Windows Debug bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: YYMusic-windows-debug-${{ github.sha }}
          path: build/windows/x64/runner/Debug/
          if-no-files-found: error
          retention-days: 14

  android-debug:
    name: Android Debug APK and private draft Release
    needs: checks
    if: github.event_name != 'workflow_dispatch' || !inputs.run_just_audio_poc
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install pinned Android build components
        run: |
          sdk_manager="${ANDROID_HOME:?ANDROID_HOME is required}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_manager"
          "$sdk_manager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --no-pub
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose build/app/outputs/flutter-apk/app-debug.apk'
      - name: Verify packaged design assets
        shell: pwsh
        run: ./tools/verify_android_apk.ps1
      - name: Package APK with commit and checksum
        run: node tools/android_artifact.mjs
      - name: Create private draft Release with verified APK
        id: android-apk-release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="ci-debug-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_notes="build/ci/android-debug/RELEASE_NOTES.md"
          {
            echo 'GitHub-built YYMusic Android Debug APK for testing.'
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo 'The APK passed apksigner verification and packaged-asset byte checks.'
            echo 'Debug signing uses the ephemeral GitHub runner key and is not suitable for production updates.'
          } > "$release_notes"
          gh --version
          release_url="$(
            gh release create "$release_tag" \
              'build/ci/android-debug/YYMusic-debug.apk#YYMusic Android Debug APK' \
              'build/ci/android-debug/SHA256SUMS#APK SHA-256 checksum' \
              'build/ci/android-debug/build-metadata.json#GitHub build metadata' \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "YYMusic Android Debug ${GITHUB_SHA:0:12}" \
              --notes-file "$release_notes" \
              --draft \
              --prerelease
          )"
          case "$release_url" in
            https://github.com/Z-YO-YI/YYMusic/releases/tag/untagged-*) ;;
            *) echo 'Unexpected draft Release URL' >&2; exit 1 ;;
          esac
          echo "release-tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release-url=$release_url" >> "$GITHUB_OUTPUT"
      - name: Add draft Release download to build summary
        if: github.event_name == 'workflow_dispatch'
        env:
          YY_APK_RELEASE_TAG: ${{ steps.android-apk-release.outputs.release-tag }}
          YY_APK_RELEASE_URL: ${{ steps.android-apk-release.outputs.release-url }}
        run: node tools/android_artifact.mjs --summary

  windows-just-audio:
    name: Windows just_audio native local WAV
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.run_just_audio_poc
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Require a real Windows playback endpoint
        shell: pwsh
        run: |
          $serviceNames = @('AudioEndpointBuilder', 'Audiosrv')
          foreach ($serviceName in $serviceNames) {
            Set-Service -Name $serviceName -StartupType Manual
            Start-Service -Name $serviceName
          }

          $services = Get-Service -Name $serviceNames
          $playbackEndpoints = @(
            Get-PnpDevice -Class AudioEndpoint -PresentOnly -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Status -eq 'OK' -and
                $_.FriendlyName -notmatch 'Microphone|Input'
              }
          )
          $serviceSummary = ($services |
            ForEach-Object { "$($_.Name)=$($_.Status)" }) -join ','
          Write-Host "YYMUSIC_WINDOWS_AUDIO_ENV services=$serviceSummary playbackEndpoints=$($playbackEndpoints.Count)"
          if ($services.Where({ $_.Status -ne 'Running' }).Count -ne 0) {
            throw 'The Windows audio services are not running.'
          }
          if ($playbackEndpoints.Count -eq 0) {
            throw 'No real Windows playback endpoint is available on this runner.'
          }
      - name: Run generated WAV through the Windows just_audio backend
        run: flutter test --no-pub integration_test/just_audio_native_local_poc_test.dart -d windows --reporter expanded

  android-just-audio:
    name: Android x86_64 just_audio native local WAV
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.run_just_audio_poc
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run generated WAV through the Android just_audio backend
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          ndk: 28.2.13676358
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: flutter test --no-pub integration_test/just_audio_native_local_poc_test.dart -d emulator-${EMULATOR_PORT} --reporter expanded
