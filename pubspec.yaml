name: yymusic
description: "YYMusic native client — Android and Windows design foundation."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.2'

dependencies:
  drift: ^2.34.3
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0
  flutter_svg: ^2.3.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.2

dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.4

flutter:
  uses-material-design: false
  assets:
    - assets/icons/yymusic/
    - assets/fonts/inter/OFL.txt
    - assets/fonts/noto_sans_sc/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/InterVariable.ttf
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/noto_sans_sc/NotoSansSCVariable.ttf
